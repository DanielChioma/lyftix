[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lyftix-workers"
version = "0.1.0"
description = "One-shot ingestion workers for Lyftix"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "psutil>=6,<8",
    "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.8,<1",
]

[project.scripts]
lyftix-worker = "lyftix_workers.main:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
