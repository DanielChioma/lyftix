name: lyftix

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - default
      - worker_db
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      LYFTIX_CORS_ALLOWED_ORIGINS: ${LYFTIX_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      LYFTIX_SESSION_COOKIE_SECURE: ${LYFTIX_SESSION_COOKIE_SECURE:-true}
      LYFTIX_AUTH_BOOTSTRAP_USERNAME: ${LYFTIX_AUTH_BOOTSTRAP_USERNAME:-}
      LYFTIX_AUTH_BOOTSTRAP_PASSWORD: ${LYFTIX_AUTH_BOOTSTRAP_PASSWORD:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-8088}:8080"
    restart: unless-stopped

  worker-api:
    profiles: [workers]
    build:
      context: ../backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      LYFTIX_CORS_ALLOWED_ORIGINS: ${LYFTIX_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      LYFTIX_SESSION_COOKIE_SECURE: "false"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - worker_api
      - worker_db
    restart: unless-stopped

  github-worker:
    profiles: [workers]
    build:
      context: ../workers
      dockerfile: Dockerfile
    init: true
    depends_on:
      worker-api:
        condition: service_started
    command: [github-schedule]
    environment:
      LYFTIX_API_BASE_URL: http://worker-api:8080
      LYFTIX_WORKER_USERNAME: ${LYFTIX_WORKER_USERNAME:-}
      LYFTIX_WORKER_PASSWORD: ${LYFTIX_WORKER_PASSWORD:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_USERNAME: ${GITHUB_USERNAME:-}
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}
      HTTP_TIMEOUT_SECONDS: ${WORKER_HTTP_TIMEOUT_SECONDS:-10}
      GITHUB_EVENTS_PER_PAGE: ${GITHUB_EVENTS_PER_PAGE:-30}
      GITHUB_MAX_PAGES_PER_RUN: ${GITHUB_MAX_PAGES_PER_RUN:-3}
      GITHUB_INGESTION_INTERVAL_SECONDS: ${GITHUB_INGESTION_INTERVAL_SECONDS:-900}
      WORKER_STATE_PATH: /var/lib/lyftix-workers/github.json
    volumes:
      - github_worker_state:/var/lib/lyftix-workers
    networks:
      - worker_api
    restart: unless-stopped

  system-metrics-worker:
    profiles: [workers]
    build:
      context: ../workers
      dockerfile: Dockerfile
    init: true
    depends_on:
      worker-api:
        condition: service_started
    command: [system-metrics-schedule]
    environment:
      LYFTIX_API_BASE_URL: http://worker-api:8080
      LYFTIX_WORKER_USERNAME: ${LYFTIX_WORKER_USERNAME:-}
      LYFTIX_WORKER_PASSWORD: ${LYFTIX_WORKER_PASSWORD:-}
      HTTP_TIMEOUT_SECONDS: ${WORKER_HTTP_TIMEOUT_SECONDS:-10}
      SYSTEM_METRICS_SOURCE: ${SYSTEM_METRICS_SOURCE:-container}
      SYSTEM_METRICS_DISK_PATH: /
      SYSTEM_METRICS_INTERVAL_SECONDS: ${SYSTEM_METRICS_INTERVAL_SECONDS:-60}
    networks:
      - worker_api
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    restart: unless-stopped

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.53.0
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.33.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.3
    depends_on:
      alertmanager:
        condition: service_started
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.1
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  github_worker_state:

networks:
  worker_api:
  worker_db:
    internal: true
