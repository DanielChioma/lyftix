logging.structured.format.console=logstash
logging.structured.json.add.application=lyftix-backend

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

lyftix.cors.allowed-origins=${LYFTIX_CORS_ALLOWED_ORIGINS}
server.servlet.session.cookie.secure=${LYFTIX_SESSION_COOKIE_SECURE:true}

server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${LYFTIX_SHUTDOWN_TIMEOUT:30s}
