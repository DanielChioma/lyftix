spring.application.name=backend

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:lyftix}
spring.datasource.username=${DB_USERNAME:lyftix_user}
spring.datasource.password=${DB_PASSWORD:lyftix_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=lyftix-backend

lyftix.cors.allowed-origins=${LYFTIX_CORS_ALLOWED_ORIGINS:http://localhost:5173}
